name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Gio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test the support relay
        if: runner.os == 'Linux'
        run: node --test support/relay/worker.test.mjs

  android:
    # Builds the showcase as an APK, so a change that breaks Android
    # (cgo code, the Java helper, gogio packaging) fails here rather than
    # in an app. The runner image ships the Android SDK, NDK and a JDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install gogio
        run: go install gioui.org/cmd/gogio@v0.10.3
      - name: Build the showcase APK
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          gogio -target android -arch arm64 -appid org.giode.showcase -o showcase.apk ./examples/showcase
      - name: Check giode's Java helper is packed
        run: unzip -p showcase.apk 'classes*.dex' | grep -aq 'Lorg/giode/mobile/mobile_android;'
      - name: Build the scanner example APK
        # Compiles the camera, OCR, biometric and printing packages'
        # cgo and packs their Java helpers. Upstream gogio leaves out
        # ML Kit (the giode CLI adds it from android_dependencies.txt),
        # so OCR itself only works in CLI builds.
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          gogio -target android -arch arm64 -appid org.giode.scanner -o scanner.apk ./examples/scanner
          for c in camera/camera_android biometric/biometric_android printing/printing_android ocr/ocr_android; do
            unzip -p scanner.apk 'classes*.dex' | grep -aq "Lorg/giode/$c;" || { echo "missing $c"; exit 1; }
          done
      - name: Compile the store and support packages for Android
        # Their Android code (Play Billing, the installer check) is in no
        # example app.
        run: |
          ndk="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
            CC="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            go vet ./store ./support
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-apk
          path: showcase.apk

  ios:
    # Builds the showcase for the iOS simulator, compiling giode's
    # Objective-C (share sheet, lifecycle, haptics, photo picker,
    # Keychain) with the real SDK.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install gogio
        run: go install gioui.org/cmd/gogio@v0.10.3
      - name: Build the showcase for the simulator
        # gogio builds simulator apps for amd64 only; Xcode cross-compiles
        # them on the arm64 runner.
        # Go's cgo needs an explicit deployment target for the iOS
        # runtime, or clang gets -miphoneos-version-min=0.0.
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: gogio -target ios -arch amd64 -minsdk 15 -appid org.giode.showcase -o showcase.app ./examples/showcase
      - name: Build the scanner example for the simulator
        # Compiles the camera, OCR, biometric, printing and gallery
        # packages' Objective-C with the iOS SDK.
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: gogio -target ios -arch amd64 -minsdk 15 -appid org.giode.scanner -o scanner.app ./examples/scanner
      - name: Build the dictation example for the simulator
        # Compiles the dictate package's Objective-C (Speech, the
        # microphone) with the iOS SDK.
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: gogio -target ios -arch amd64 -minsdk 15 -appid org.giode.dictation -o dictation.app ./examples/dictation
      - name: Build the attach example for the simulator
        # Compiles the takephoto package's Objective-C (the camera).
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: gogio -target ios -arch amd64 -minsdk 15 -appid org.giode.attach -o attach.app ./examples/attach
