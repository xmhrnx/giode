# The Giode support relay; see README.md.
name = "giode-support"
main = "worker.js"
compatibility_date = "2025-06-01"

# Create it with `npx wrangler kv namespace create SUPPORT` and put the
# id it prints here.
[[kv_namespaces]]
binding = "SUPPORT"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Each app's support.Options.App, and the repository its reports go to.
APPS = '{"sonora": "xmhrnx/sonora", "easysend": "xmhrnx/easysend"}'
LABELS = "user report"
PER_HOUR = "5"
PER_DAY = "20"
